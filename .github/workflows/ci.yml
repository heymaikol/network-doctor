name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  test:
    strategy:
      fail-fast: false
      matrix:
        # Seeded netem scenarios require iproute2 6.6 or newer.
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
      - if: runner.os != 'Linux'
        run: go test ./...
      - if: runner.os == 'Linux'
        name: Run tests with coverage
        run: |
          mkdir -p coverage
          go test -covermode=set -coverprofile=coverage/unit.out ./...
      - if: runner.os != 'Linux'
        run: go test -tags integration ./internal/diagnostic ./internal/peer ./internal/simulation
      # Required gate on both native hosts: it holds the built binary's route,
      # interface, and source-address evidence to what Windows and macOS
      # themselves report, which is the one thing the Linux simulator cannot
      # check. -count=1 because a cached result would not have touched the host.
      - if: runner.os != 'Linux'
        name: Run native OS acceptance tests
        run: go test -tags acceptance -count=1 -run '^TestNative' . ./internal/ui
      - if: runner.os == 'Linux'
        name: Run loopback integration tests with coverage
        run: go test -covermode=set -coverprofile=coverage/integration.out -tags integration ./internal/diagnostic ./internal/peer ./internal/simulation
      # The job runner does concurrent subprocess cancellation; gate it.
      - if: runner.os == 'Linux'
        run: go test -race ./...
      # The loopback socket tests run servers and probes in parallel goroutines,
      # so they are worth racing too. Separate invocation: the tag changes the
      # build, and applying it to ./... would compile integration files into
      # every other package's test binary.
      - if: runner.os == 'Linux'
        run: go test -race -tags integration ./internal/diagnostic ./internal/peer ./internal/simulation
      # Smoke-fuzz the parsers fed by input we do not control (terminal output,
      # target arguments, encrypted-DNS responses, and peer frames) so regressions don't
      # rely on contributors remembering to fuzz locally.
      - if: runner.os == 'Linux'
        run: go test -fuzz=FuzzSanitize -fuzztime=10s ./internal/textsafe
      - if: runner.os == 'Linux'
        run: go test -fuzz=FuzzEncryptedDNSResponseVerifier -fuzztime=10s ./internal/diagnostic
      - if: runner.os == 'Linux'
        run: go test -fuzz=FuzzParseTarget -fuzztime=10s ./internal/diagnostic
      - if: runner.os == 'Linux'
        run: go test -fuzz=FuzzDecodeMessage -fuzztime=10s ./internal/peer
      # The Challenge Mode generator builds every hunt case from a seed, so
      # smoke-fuzz it too: a bad seed there produces an invalid scenario.
      - if: runner.os == 'Linux'
        run: go test -fuzz=FuzzGenerateHuntCase -fuzztime=10s ./internal/simulation
      # Builds real network namespaces to run netdoc inside deliberately broken
      # networks. Rootless: it uses an unprivileged user namespace.
      #
      # NETDOC_SIM_REQUIRE_NETNS turns "this host cannot simulate" from a skip
      # into a failure. Without it a runner that loses unprivileged user
      # namespaces would go green while testing nothing, and a backend
      # regression would sit unnoticed until someone ran it locally.
      #
      # Ubuntu 24.04 and later ship AppArmor's unprivileged-userns restriction
      # on, which denies the backend the namespace it needs. Clearing it on the
      # throwaway runner keeps the tests rootless; netdoc-sim itself still
      # refuses to escalate.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        name: Run namespace integration tests
        run: go test -covermode=set -coverprofile=coverage/netns.out -tags netns_integration -count=1 -skip '^TestGeneratedStressHuntPMTUBlackholeCaseReachesThePathMTUProbe$' ./internal/simulation
        env:
          NETDOC_SIM_REQUIRE_NETNS: "1"
      # Keep one small fixed-seed stress Hunt regression separate from the
      # rotating nightly lanes. This test runs seed 20260102 case 20 and checks
      # that its known generated path-MTU fault still reaches the intended probe.
      - if: runner.os == 'Linux'
        name: Run fixed-seed stress Hunt regression
        run: go test -covermode=set -coverprofile=coverage/netns-stress.out -tags netns_integration -count=1 -run '^TestGeneratedStressHuntPMTUBlackholeCaseReachesThePathMTUProbe$' ./internal/simulation
        env:
          NETDOC_SIM_REQUIRE_NETNS: "1"
      - if: runner.os == 'Linux'
        name: Merge coverage
        run: |
          go run ./cmd/covermerge -o coverage.out coverage/unit.out coverage/integration.out coverage/netns.out coverage/netns-stress.out
          go tool cover -func=coverage.out
      - if: runner.os == 'Linux'
        name: Upload merged coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
  # The container is how macOS and Windows reach Challenge Mode, so the artifact
  # is tested rather than assumed: this job builds the image and runs a real
  # namespace-backed simulation and a real challenge inside it. The runner's
  # Docker is the point: it has the default seccomp profile Docker Desktop
  # ships, which is what the documented --cap-add SYS_ADMIN exists for.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Keep the full artifact suite native. QEMU is configured only after it
      # finishes, so this build and every container integration test stay amd64.
      - run: docker build --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" -t netdoc-sim:ci .
      # NETDOC_REQUIRE_CONTAINER turns "no image or no engine" from a skip into a
      # failure, so this job cannot go green without having run the container.
      - run: go test -tags container -count=1 -v .
        env:
          NETDOC_CONTAINER_IMAGE: netdoc-sim:ci
          NETDOC_CONTAINER_ENGINE: docker
          NETDOC_REQUIRE_CONTAINER: "1"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and smoke-test the arm64 image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --load \
            --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" \
            -t netdoc-sim:ci-arm64 .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' netdoc-sim:ci-arm64)" = linux/arm64
          # ELF e_machine 183 is AArch64. Image metadata alone cannot prove the
          # copied binary matches it.
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh netdoc-sim:ci-arm64 \
            -c 'test "$(od -An -tu2 -j18 -N2 /usr/bin/netdoc-sim)" -eq 183'
          test "$(docker run --rm --platform linux/arm64 netdoc-sim:ci-arm64 version)" = "netdoc-sim ci"
          capabilities=$(docker run --rm --platform linux/arm64 netdoc-sim:ci-arm64 capabilities)
          printf '%s\n' "$capabilities"
          grep -Fx 'Backend:   linux-netns' <<< "$capabilities"
          grep -Fx 'Supported: true' <<< "$capabilities"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Not go.mod: that pins the oldest *supported* toolchain, and
          # govulncheck reports every stdlib CVE patched since it. The test
          # matrix above still proves the code builds on that minimum.
          # The floor must stay above the Go the runner image pre-caches, or
          # setup-go resolves to that cache entry instead of downloading.
          go-version: ">=1.27.0"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      # GoReleaser shells out to syft for the `sboms` block; the GoReleaser
      # action does not bring it along. Pinned action, pinned tool version.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.42.0
      # Validate the GoReleaser config here so breakage surfaces before tag day.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: check
      # `check` only parses the config. Build the real artifacts too, because
      # the contract users get is "installing network-doctor installs netdoc and
      # netdoc-sim", and that is a property of the package, not of the YAML.
      # No credentials: a snapshot publishes nothing.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=publish,validate
      - name: Verify Linux packages install both executables
        run: |
          set -euo pipefail
          deb=$(echo dist/*_linux_amd64.deb)
          rpm_pkg=$(echo dist/*_linux_amd64.rpm)
          # Compared as sets, so a binary added to one packaging path and not
          # the other fails here instead of on someone's machine.
          # The trailing dot in the pattern drops the /usr/bin/ directory entry
          # a deb carries and an rpm does not.
          deb_bins=$(dpkg-deb -c "$deb" | awk '{print $NF}' | sed 's|^\./|/|' \
            | grep '^/usr/bin/.' | sort)
          rpm_bins=$(rpm -qlp "$rpm_pkg" | grep '^/usr/bin/.' | sort)
          printf 'deb: %s\nrpm: %s\n' "$deb_bins" "$rpm_bins"
          test "$deb_bins" = "$(printf '/usr/bin/netdoc\n/usr/bin/netdoc-sim')"
          test "$rpm_bins" = "$deb_bins"
          # Both have to actually run, from the packaged copy, with no privileges.
          dpkg-deb -x "$deb" pkgroot
          ./pkgroot/usr/bin/netdoc -version
          ./pkgroot/usr/bin/netdoc-sim help > /dev/null
      # Reading the archive proves what the .deb contains. It cannot prove that
      # apt and dpkg will take it, which is a separate class of packaging
      # failure, so the package built above is also installed the way the README
      # tells users to install it. The container is the isolation: a clean
      # Debian, so no copy already on the runner can carry the test, and the
      # runner itself never has network-doctor installed on it. --network none
      # because the package declares no dependencies, so a real install has
      # nothing to fetch, and this stops passing if that ever changes. Pinned by
      # digest like every other image and action here.
      - name: Install the .deb in a clean Debian container
        run: |
          set -euo pipefail
          docker run --rm -i --network none \
            -v "$PWD/dist:/dist:ro" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1 \
            sh -eu <<'SMOKE'
          # Nothing is installed yet, so nothing below can pass on a copy that
          # was already there. Not `! command -v netdoc`: set -e ignores a
          # command whose status is inverted with !, so that spelling asserts
          # nothing. The empty output is the assertion.
          test -z "$(command -v netdoc)"
          test -z "$(command -v netdoc-sim)"
          apt-get install -y /dist/*_linux_amd64.deb
          test "$(dpkg-query -W -f '${Status}' network-doctor)" = 'install ok installed'
          test "$(command -v netdoc)" = /usr/bin/netdoc
          test "$(command -v netdoc-sim)" = /usr/bin/netdoc-sim
          # dpkg -V names every installed file that is missing or altered and
          # still exits 0, so the empty report is the assertion.
          verify=$(dpkg -V network-doctor)
          test -z "$verify" || { printf 'dpkg -V network-doctor:\n%s\n' "$verify"; exit 1; }
          netdoc --version
          netdoc-sim version
          SMOKE
