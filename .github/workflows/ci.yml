name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  completion-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install completion shells
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fish zsh
      - name: Check completion script syntax
        run: |
          set -euo pipefail
          for script in packaging/completions/*.bash; do bash -n "$script"; done
          for script in packaging/completions/*.zsh; do zsh -n "$script"; done
          for script in packaging/completions/*.fish; do fish -n "$script"; done
  
  manpage-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mandoc
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y mandoc
      - name: Check man page syntax
        run: |
          set -euo pipefail
          mandoc -Tlint packaging/netdoc.1
          mandoc -Tlint packaging/netdoc-sim.1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
      - if: runner.os == 'macOS'
        run: go test ./...
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Temporary workaround for golang/go#81368: cmd/go can hang before launching
          # the internal/ui test binary on GitHub-hosted Windows runners.
          # Compile that package's tests and execute the binaries directly instead.
          $uiPkg = go list ./internal/ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $allPkgs = @(go list ./...)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rest = @($allPkgs | Where-Object { $_ -ne $uiPkg })
          if (($allPkgs.Count - $rest.Count) -ne 1) {
            Write-Error "expected exactly one package excluded, got $($allPkgs.Count - $rest.Count)"
            exit 1
          }
          if ($rest.Count -eq 0) {
            Write-Error "no packages remain after excluding internal/ui"
            exit 1
          }
          go test @rest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uiTest = Join-Path $env:RUNNER_TEMP 'ui.test.exe'
          go test -c -o $uiTest ./internal/ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uiExit = 0
          Push-Location ./internal/ui
          try {
            $uiArgs = @(
              '-test.timeout=10m'
            )
            & $uiTest @uiArgs
            $uiExit = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }
          if ($uiExit -ne 0) { exit $uiExit }
      - run: go test -tags integration ./internal/app ./internal/diagnostic ./internal/peer ./internal/simulation
      # Required gate on both native hosts: it holds the built binary's route,
      # interface, and source-address evidence to what Windows and macOS
      # themselves report, which is the one thing the Linux simulator cannot
      # check. -count=1 because a cached result would not have touched the host.
      - if: runner.os == 'macOS'
        name: Run native OS acceptance tests
        run: go test -tags acceptance -count=1 -run '^TestNative' . ./internal/ui
      - if: runner.os == 'Windows'
        name: Run native OS acceptance tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -tags acceptance -count=1 -run '^TestNative' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uiAcceptanceTest = Join-Path $env:RUNNER_TEMP 'ui-acceptance.test.exe'
          go test -c -tags acceptance -o $uiAcceptanceTest ./internal/ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uiAcceptanceExit = 0
          Push-Location ./internal/ui
          try {
            $uiAcceptanceArgs = @(
              '-test.run=^TestNative'
              '-test.count=1'
              '-test.timeout=10m'
            )
            & $uiAcceptanceTest @uiAcceptanceArgs
            $uiAcceptanceExit = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }
          if ($uiAcceptanceExit -ne 0) { exit $uiAcceptanceExit }

  # Every suite the other two hosts cannot run lives here: the contributor
  # gate, coverage, race, fuzz, and real network namespaces. They are
  # independent of each other, so they run as parallel shards and the required
  # gate below costs the longest shard rather than their sum. Nothing is split
  # across a shard boundary and merged back, with one exception: all four
  # coverage-producing suites stay in the `coverage` shard so `coverage.out`
  # is still merged from complete profiles in one place.
  #
  # Seeded netem scenarios require iproute2 6.6 or newer, hence ubuntu-26.04.
  linux:
    name: linux (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [check, coverage, race, race-integration, fuzz]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Which packages carry integration-tagged tests is discovered rather than
      # listed, because two shards have to agree on it: the race shard leaves
      # these packages out and the race-integration shard picks them up. A list
      # written twice can be updated once. Adding the tag to a new package puts
      # it in both lanes here with no edit, and dropping the tag takes it out of
      # both, so neither lane can silently stop racing a package.
      #
      # A package's test file count changes when the tag is on, and go list
      # prints packages sorted by import path, so comm reports exactly the
      # packages the tag adds files to.
      - name: Resolve the integration-tagged packages
        run: |
          set -euo pipefail
          fmt='{{.ImportPath}} {{len .TestGoFiles}} {{len .XTestGoFiles}}'
          integration=$(comm -13 <(go list -f "$fmt" ./...) <(go list -tags integration -f "$fmt" ./...) | cut -d' ' -f1)
          # An empty result would race every package in the ordinary lane and
          # run no integration-tagged test at all, both of which look green.
          test -n "$integration"
          # grep exits non-zero when nothing is left, which is the same kind of
          # silent emptiness, so the pipeline failing here is the point.
          ordinary=$(go list ./... | grep -vxF "$integration")
          printf 'integration-tagged:\n%s\n\nordinary race lane:\n%s\n' "$integration" "$ordinary"
          {
            printf 'INTEGRATION_PACKAGES<<EOF\n%s\nEOF\n' "$integration"
            printf 'ORDINARY_RACE_PACKAGES<<EOF\n%s\nEOF\n' "$ordinary"
          } >> "$GITHUB_ENV"

      # The contributor-facing fast gate, run as the real command so the script
      # cannot rot unnoticed. Contributors are told to run `scripts/check`, and
      # running the real script is the only thing that proves it still works.
      # Asserting on its text cannot. It is its own shard because most of its
      # work is repeated by the shards below, so paying for it no longer delays
      # any of them. It also covers this platform's `go vet` and
      # `CGO_ENABLED=0 go build`, which is why the matrix above runs those only
      # on the hosts that have no shard here.
      - if: matrix.shard == 'check'
        name: Run the fast local check contributors are asked to run
        run: ./scripts/check

      # Every coverage-producing suite runs in this one shard, so the merge
      # below still sees all four profiles without moving them between jobs.
      - if: matrix.shard == 'coverage'
        name: Run tests with coverage
        run: |
          mkdir -p coverage
          go test -covermode=set -coverprofile=coverage/unit.out ./...
      - if: matrix.shard == 'coverage'
        name: Run loopback integration tests with coverage
        run: go test -covermode=set -coverprofile=coverage/integration.out -tags integration $INTEGRATION_PACKAGES
      # Builds real network namespaces to run netdoc inside deliberately broken
      # networks. Rootless: it uses an unprivileged user namespace.
      #
      # NETDOC_SIM_REQUIRE_NETNS turns "this host cannot simulate" from a skip
      # into a failure. Without it a runner that loses unprivileged user
      # namespaces would go green while testing nothing, and a backend
      # regression would sit unnoticed until someone ran it locally.
      #
      # Ubuntu 24.04 and later ship AppArmor's unprivileged-userns restriction
      # on, which denies the backend the namespace it needs. Clearing it on the
      # throwaway runner keeps the tests rootless; netdoc-sim itself still
      # refuses to escalate.
      - if: matrix.shard == 'coverage'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      #
      # Each scenario builds its own namespaces under a random run id, so the
      # runs are independent and -parallel decides how many stand at once. Most
      # of a run is spent waiting on probe deadlines rather than on CPU, so four
      # at a time cuts the step to about a third of its serial wall time.
      - if: matrix.shard == 'coverage'
        name: Run namespace integration tests
        run: go test -covermode=set -coverprofile=coverage/netns.out -tags netns_integration -count=1 -parallel 4 -skip '^TestGeneratedStressHuntPMTUBlackholeCaseReachesThePathMTUProbe$' ./internal/simulation
        env:
          NETDOC_SIM_REQUIRE_NETNS: "1"
      # Keep one small fixed-seed stress Hunt regression separate from the
      # rotating nightly lanes. This test runs seed 20260102 case 20 and checks
      # that its known generated path-MTU fault still reaches the intended probe.
      - if: matrix.shard == 'coverage'
        name: Run fixed-seed stress Hunt regression
        run: go test -covermode=set -coverprofile=coverage/netns-stress.out -tags netns_integration -count=1 -run '^TestGeneratedStressHuntPMTUBlackholeCaseReachesThePathMTUProbe$' ./internal/simulation
        env:
          NETDOC_SIM_REQUIRE_NETNS: "1"
      - if: matrix.shard == 'coverage'
        name: Merge coverage
        run: |
          go run ./cmd/covermerge -o coverage.out coverage/unit.out coverage/integration.out coverage/netns.out coverage/netns-stress.out
          go tool cover -func=coverage.out
      - if: matrix.shard == 'coverage'
        name: Upload merged coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

      # The job runner does concurrent subprocess cancellation; gate it.
      #
      # The integration-tagged packages are left out because the shard below
      # races them: an integration-tagged build compiles the package's ordinary
      # test files too, so those tests were being raced once here and again
      # there. Excluding them drops the second run, not the coverage.
      - if: matrix.shard == 'race'
        run: go test -race $ORDINARY_RACE_PACKAGES
      # The loopback socket tests run servers and probes in parallel goroutines,
      # so they are worth racing too. Separate invocation: the tag changes the
      # build, and applying it to ./... would compile integration files into
      # every other package's test binary.
      - if: matrix.shard == 'race-integration'
        run: go test -race -tags integration $INTEGRATION_PACKAGES

      # Smoke-fuzz the parsers fed by input we do not control (terminal output,
      # target arguments, encrypted-DNS responses, and peer frames) so regressions don't
      # rely on contributors remembering to fuzz locally.
      #
      # -run='^$' matches no ordinary test, so each command builds the package
      # and starts fuzzing instead of first replaying that package's whole unit
      # suite, which the shards above already ran. It does not skip the seed
      # corpus: go test runs every seed and cached corpus entry to gather the
      # coverage baseline before it generates anything, and a seed that fails
      # there still fails the command.
      - if: matrix.shard == 'fuzz'
        run: go test -run='^$' -fuzz=FuzzSanitize -fuzztime=10s ./internal/textsafe
      - if: matrix.shard == 'fuzz'
        run: go test -run='^$' -fuzz=FuzzEncryptedDNSResponseVerifier -fuzztime=10s ./internal/diagnostic
      - if: matrix.shard == 'fuzz'
        run: go test -run='^$' -fuzz=FuzzParseTarget -fuzztime=10s ./internal/diagnostic
      - if: matrix.shard == 'fuzz'
        run: go test -run='^$' -fuzz=FuzzDecodeMessage -fuzztime=10s ./internal/peer
      # The Challenge Mode generator builds every hunt case from a seed, so
      # smoke-fuzz it too: a bad seed there produces an invalid scenario.
      - if: matrix.shard == 'fuzz'
        run: go test -run='^$' -fuzz=FuzzGenerateHuntCase -fuzztime=10s ./internal/simulation

  # The required Linux check. It carries the name branch protection asks for,
  # and it is the only job that can report Linux green, so no shard can be
  # mistaken for the whole gate.
  #
  # always() rather than success(), because the job has to run in order to
  # report a failed dependency at all, and rather than !cancelled(), which
  # would leave this check skipped rather than failed when a shard is
  # cancelled. The result of every entry in needs is checked, not just the
  # failure of one, so a shard that is cancelled or unexpectedly skipped fails
  # this check the same way a failing one does. Reading it from toJSON(needs)
  # rather than naming shards means a shard added later is covered by default.
  linux-gate:
    name: test (ubuntu-26.04)
    needs: [linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Linux shard to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS"
          unmet=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$unmet" ]; then
            printf 'Linux shards that did not succeed:\n%s\n' "$unmet" >&2
            exit 1
          fi

  # The container is how macOS and Windows reach Challenge Mode, so the artifact
  # is tested rather than assumed: this job builds the image and runs a real
  # namespace-backed simulation and a real challenge inside it. The runner's
  # Docker is the point: it has the default seccomp profile Docker Desktop
  # ships, which is what the documented --cap-add SYS_ADMIN exists for.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Keep the full artifact suite native. QEMU is configured only after it
      # finishes, so this build and every container integration test stay amd64.
      - run: docker build --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" -t netdoc-sim:ci .
      # NETDOC_REQUIRE_CONTAINER turns "no image or no engine" from a skip into a
      # failure, so this job cannot go green without having run the container.
      - run: go test -tags container -count=1 -v .
        env:
          NETDOC_CONTAINER_IMAGE: netdoc-sim:ci
          NETDOC_CONTAINER_ENGINE: docker
          NETDOC_REQUIRE_CONTAINER: "1"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build and smoke-test the arm64 image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --load \
            --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" \
            -t netdoc-sim:ci-arm64 .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' netdoc-sim:ci-arm64)" = linux/arm64
          # ELF e_machine 183 is AArch64. Image metadata alone cannot prove the
          # copied binary matches it.
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh netdoc-sim:ci-arm64 \
            -c 'test "$(od -An -tu2 -j18 -N2 /usr/bin/netdoc-sim)" -eq 183'
          test "$(docker run --rm --platform linux/arm64 netdoc-sim:ci-arm64 version)" = "netdoc-sim ci"
          capabilities=$(docker run --rm --platform linux/arm64 netdoc-sim:ci-arm64 capabilities)
          printf '%s\n' "$capabilities"
          grep -Fx 'Backend:   linux-netns' <<< "$capabilities"
          grep -Fx 'Supported: true' <<< "$capabilities"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Not go.mod: that pins the oldest *supported* toolchain, and
          # govulncheck reports every stdlib CVE patched since it. The test
          # matrix above still proves the code builds on that minimum.
          # The floor must stay above the Go the runner image pre-caches, or
          # setup-go resolves to that cache entry instead of downloading.
          go-version: ">=1.27.0"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      # GoReleaser shells out to syft for the `sboms` block; the GoReleaser
      # action does not bring it along. Pinned action, pinned tool version.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.42.0
      # Validate the GoReleaser config here so breakage surfaces before tag day.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: check
      # `check` only parses the config. Build the real artifacts too, because
      # the contract users get is "installing network-doctor installs netdoc and
      # netdoc-sim", and that is a property of the package, not of the YAML.
      # No credentials: a snapshot publishes nothing.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=publish,validate
      - name: Verify Linux packages install both executables
        run: |
          set -euo pipefail
          deb=$(echo dist/*_linux_amd64.deb)
          rpm_pkg=$(echo dist/*_linux_amd64.rpm)
          # Compared as sets, so a binary added to one packaging path and not
          # the other fails here instead of on someone's machine.
          # The trailing dot in the pattern drops the /usr/bin/ directory entry
          # a deb carries and an rpm does not.
          deb_bins=$(dpkg-deb -c "$deb" | awk '{print $NF}' | sed 's|^\./|/|' \
            | grep '^/usr/bin/.' | sort)
          rpm_bins=$(rpm -qlp "$rpm_pkg" | grep '^/usr/bin/.' | sort)
          printf 'deb: %s\nrpm: %s\n' "$deb_bins" "$rpm_bins"
          test "$deb_bins" = "$(printf '/usr/bin/netdoc\n/usr/bin/netdoc-sim')"
          test "$rpm_bins" = "$deb_bins"
          # Both have to actually run, from the packaged copy, with no privileges.
          dpkg-deb -x "$deb" pkgroot
          ./pkgroot/usr/bin/netdoc -version
          ./pkgroot/usr/bin/netdoc-sim help > /dev/null
      # Reading the archive proves what the .deb contains. It cannot prove that
      # apt and dpkg will take it, which is a separate class of packaging
      # failure, so the package built above is also installed the way the README
      # tells users to install it. The container is the isolation: a clean
      # Debian, so no copy already on the runner can carry the test, and the
      # runner itself never has network-doctor installed on it. --network none
      # because the package declares no dependencies, so a real install has
      # nothing to fetch, and this stops passing if that ever changes. Pinned by
      # digest like every other image and action here.
      - name: Install the .deb in a clean Debian container
        run: |
          set -euo pipefail
          docker run --rm -i --network none \
            -v "$PWD/dist:/dist:ro" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1 \
            sh -eu <<'SMOKE'
          # Nothing is installed yet, so nothing below can pass on a copy that
          # was already there. Not `! command -v netdoc`: set -e ignores a
          # command whose status is inverted with !, so that spelling asserts
          # nothing. The empty output is the assertion.
          test -z "$(command -v netdoc)"
          test -z "$(command -v netdoc-sim)"
          apt-get install -y /dist/*_linux_amd64.deb
          test "$(dpkg-query -W -f '${Status}' network-doctor)" = 'install ok installed'
          test "$(command -v netdoc)" = /usr/bin/netdoc
          test "$(command -v netdoc-sim)" = /usr/bin/netdoc-sim
          # dpkg -V names every installed file that is missing or altered and
          # still exits 0, so the empty report is the assertion.
          verify=$(dpkg -V network-doctor)
          test -z "$verify" || { printf 'dpkg -V network-doctor:\n%s\n' "$verify"; exit 1; }
          netdoc --version
          netdoc-sim version
          SMOKE
      - name: Install the RPM in a clean Fedora container
        run: |
          set -euo pipefail
          docker run --rm -i --network none \
            -v "$PWD/dist:/dist:ro" \
            fedora:41@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d \
            sh -eu <<'SMOKE'
          test -z "$(command -v netdoc)"
          test -z "$(command -v netdoc-sim)"
          dnf install -y --disablerepo='*' /dist/*_linux_amd64.rpm
          rpm -q network-doctor
          test "$(command -v netdoc)" = /usr/bin/netdoc
          test "$(command -v netdoc-sim)" = /usr/bin/netdoc-sim
          netdoc --version
          netdoc-sim version
          SMOKE

      # Like the deb and rpm installation checks, exercise the package manager
      # itself in a clean container. No network ensures the install cannot
      # silently succeed by fetching an unexpected package dependency.
      - name: Install the APK in a clean Alpine container
        run: |
          set -euo pipefail
          docker run --rm -i --network none \
            -v "$PWD/dist:/dist:ro" \
            alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b \
            sh -eu <<'SMOKE'
          test -z "$(command -v netdoc)"
          test -z "$(command -v netdoc-sim)"
          apk add --allow-untrusted /dist/*_linux_amd64.apk
          apk info -e network-doctor
          test "$(command -v netdoc)" = /usr/bin/netdoc
          test "$(command -v netdoc-sim)" = /usr/bin/netdoc-sim
          netdoc --version
          netdoc-sim version
          SMOKE
