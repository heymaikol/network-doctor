name: demo

# Records the README's hero GIF from hero.tape on a disposable Linux runner
# for every release tag or a manual request. VHS, ttyd and ffmpeg all come
# from the official action.
#
# The recording uses live probes, so latencies and spinner phases make fresh
# recordings differ byte for byte. After verification, the tracked GIF follows
# the newest successful recording and is also uploaded for review.
#
# Checkout persists the job's GITHUB_TOKEN for the final git push. The tag a
# release is cut from is already on main, so the refreshed recording lands
# there; release.yml has verified that ancestry by the time this runs.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the ancestry check below has main to compare with.
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # hero.tape puts $PWD on PATH and then types `netdoc`, so the binary has
      # to land in the workspace root, which is also where the action runs VHS
      # from. That is the same build the tape's own header documents, and it is
      # what stops the recording picking up an installed netdoc from elsewhere.
      - name: Build Network Doctor
        run: go build -o netdoc .
        env:
          CGO_ENABLED: "0"
      # The action installs its default fonts whatever its install-fonts input
      # says, JetBrains Mono among them, which is the first family in VHS's own
      # default font stack and the one hero.tape records with. install-fonts
      # adds a further set on top that this recording has no use for, so the
      # input is left alone. The VHS version is pinned for the same reason
      # every other tool in this repository is: a recording that changes because
      # the renderer moved underneath it is not a recording of a change here.
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: hero.tape
          version: v0.11.0
      # A tape that fails part way still leaves a file behind, so check that the
      # recording is a real one: the dimensions hero.tape declares, and enough
      # frames to be the whole story rather than a truncated screen. ffprobe is
      # already on PATH; VHS cannot encode a GIF without ffmpeg.
      - name: Verify the recording
        run: |
          set -euo pipefail
          test -f assets/hero.gif
          # A GIF carries no frame count in its header, so -count_frames walks
          # them. mapfile rather than read, because ffprobe's last line has no
          # newline after it and read reports that as failure under set -e even
          # though every variable was assigned.
          mapfile -t recording < <(ffprobe -v error -select_streams v:0 \
            -count_frames -show_entries stream=width,height,nb_read_frames \
            -of default=nw=1:nk=1 assets/hero.gif)
          printf 'assets/hero.gif: %sx%s, %s frames\n' "${recording[@]}"
          # Set Width 1100 / Set Height 640 in hero.tape.
          test "${recording[0]}" = "1100"
          test "${recording[1]}" = "640"
          # The tape includes a four-second final hold at 25fps. Stay below that
          # exact count so encoder timing cannot make a healthy recording fail,
          # but reject a file that stopped before the finished screen was shown.
          test "${recording[2]}" -ge 100
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hero-gif
          path: assets/hero.gif
          if-no-files-found: error
      - name: Commit the changed recording
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/hero.gif; then
            echo "assets/hero.gif is unchanged"
            exit 0
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$EXPECTED_HEAD" origin/main; then
            echo "::error::$EXPECTED_HEAD is not on main; refusing to push a recording there"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.gif
          git commit -m "Refresh README hero GIF"
          git push origin HEAD:main
