name: gui

# Builds and tests the desktop window in contrib/gui. It is a separate Rust
# program that the Go pipeline never sees, so this workflow runs only when that
# folder or this file changes.

on:
  push:
    branches: [main]
    paths:
      - "contrib/gui/**"
      - ".github/workflows/gui.yml"
  pull_request:
    paths:
      - "contrib/gui/**"
      - ".github/workflows/gui.yml"

permissions:
  contents: read

jobs:
  test:
    name: format, lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: contrib/gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the window toolkit's Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
