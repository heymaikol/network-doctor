name: hunt

# Nightly deterministic Hunt: derive one exploration seed from the UTC calendar
# date, run oracle-backed diagnosis mutations separately from stress mutations,
# reproduce bug-oracle findings from their recorded lane, seed and case, and
# report the survivors.
# Filing them as issues is opt-in, twice over: a manual run has to ask for it,
# and a scheduled run files nothing until the repository variable
# NETDOC_HUNT_CREATE is set to true. Merging this workflow therefore starts the
# hunting, not the issue writing.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: bug-oracle cases per baseline before sharding
        default: "60"
      stress_cases:
        # Thirty is where the stress lane stops starving operators. At twenty,
        # five baseline-operator slots go undrawn across the eight baselines;
        # at thirty, none do. It keeps discovering new operator combinations
        # well past that, so this is a floor and not a saturation point.
        description: stress cases per baseline before sharding
        default: "30"
      create:
        description: file reproducible findings as GitHub issues
        type: boolean
        default: false

permissions:
  contents: read

# Kept in the same order as simulation.TriageBaselines. A test holds these
# names to the production list so the workflow cannot silently hunt a different
# campaign.
env:
  HUNT_BASELINES: |
    healthy
    healthy-routed-network
    dual-stack-healthy
    tls-valid
    socks5h-remote-dns-succeeds
    two-path-healthy
    two-path-ipv6-healthy
    two-router-healthy

# The triage report is piped through tee, and the default shell (`bash -e`)
# reports a pipeline's last command, not its first: without pipefail a hunt that
# exits 3 would leave the step green with the failure printed in it. Naming bash
# explicitly is what turns pipefail on, per GitHub's documented shell defaults.
defaults:
  run:
    shell: bash

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  seed:
    name: Resolve UTC exploration seed
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      # Resolve once for the whole workflow. Shards may start at different
      # times, so none of them reads the clock independently.
      - id: resolve
        run: |
          seed=$(LC_ALL=C date -u +%Y%m%d)
          case "$seed" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "invalid UTC date seed: $seed" >&2; exit 1 ;;
          esac
          printf 'value=%s\n' "$seed" >> "$GITHUB_OUTPUT"
          echo "Exploration seed: $seed"

  hunt:
    name: ${{ matrix.lane }} Hunt seed ${{ needs.seed.outputs.value }} shard ${{ matrix.shard }}/${{ matrix.shards }}
    needs: [seed]
    # Not ubuntu-latest. The hunt pins netem randomness with `netem seed`, which
    # iproute2 learned in 6.6; 24.04 ships 6.1 and rejects the keyword, so every
    # generated case that injects loss, latency or jitter fails to set up there.
    # Unseeded netem is not an option: a case that cannot repeat cannot be
    # reproduced, and reproduction is what earns a finding an issue.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: bug-oracle, shard: 0, shards: 4}
          - {lane: bug-oracle, shard: 1, shards: 4}
          - {lane: bug-oracle, shard: 2, shards: 4}
          - {lane: bug-oracle, shard: 3, shards: 4}
          - {lane: stress, shard: 0, shards: 2}
          - {lane: stress, shard: 1, shards: 2}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o netdoc . && go build -o netdoc-sim ./cmd/netdoc-sim
        env:
          CGO_ENABLED: "0"
      # Ubuntu 24.04 and later deny unprivileged user namespaces through
      # AppArmor, which is the one thing the rootless backend needs. Clearing it
      # on the throwaway runner keeps the hunt rootless; netdoc-sim still
      # refuses to escalate.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # One line in the log answering the first question a setup failure raises.
      - run: tc -V
      - name: Run ${{ matrix.lane }} shard
        env:
          CASES: ${{ matrix.lane == 'bug-oracle' && (inputs.cases || '60') || (inputs.stress_cases || '30') }}
          # The fault ceiling is per lane because its value is. A third fault
          # buys the bug-oracle lane multi-condition networks that two faults
          # cannot build at any case count: 61 of its 182 reachable operator
          # combinations need three, and where two faults can ever put two
          # oracle conditions on one network 11 ways, three can do it 48. A
          # measured 60-case run on tls-valid establishes 73 oracle conditions
          # against 51, and puts two independently observed faults on one
          # network in 28 cases against 16. The stress lane has no oracle
          # conditions to interact and a universe already too large for its
          # budget: measured at 30 cases, a third fault there drops the
          # oracle-comparable cases from 14 to 9 and establishes nothing
          # either way, so it stays at two.
          MAX_FAULTS: ${{ matrix.lane == 'bug-oracle' && '3' || '2' }}
          HUNT_SEED: ${{ needs.seed.outputs.value }}
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          mkdir -p "hunt-results/$LANE"
          while read -r base; do
            [ -n "$base" ] || continue
            output="hunt-results/$LANE/$base.$SHARD.json"
            if ./netdoc-sim hunt "$base" \
              --lane "$LANE" \
              --seed "$HUNT_SEED" \
              --cases "$CASES" \
              --shard "$SHARD/$SHARDS" \
              --max-faults "$MAX_FAULTS" \
              --json > "$output"; then
              continue
            else
              status=$?
            fi
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          done <<< "$HUNT_BASELINES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hunt-${{ matrix.lane }}-shard-${{ matrix.shard }}
          path: hunt-results
          if-no-files-found: error

  merge:
    name: Merge both Hunt lanes and triage bug-oracle seed ${{ needs.seed.outputs.value }}
    if: ${{ always() }}
    needs: [seed, hunt]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      # Job permissions cannot be decided per run, so an observation-only run
      # holds this and never uses it. The mode step withholds GH_TOKEN unless
      # this run deliberately creates issues.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o netdoc . && go build -o netdoc-sim ./cmd/netdoc-sim
        env:
          CGO_ENABLED: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hunt-*-shard-*
          path: hunt-shards
          merge-multiple: true
      - name: Merge shard reports
        run: |
          mkdir -p merged-hunts
          for lane in bug-oracle stress; do
            mkdir -p "merged-hunts/$lane"
            while read -r base; do
              [ -n "$base" ] || continue
              if ./netdoc-sim hunt merge hunt-shards/"$lane"/"$base".*.json > "merged-hunts/$lane/$base.json"; then
                continue
              else
                status=$?
              fi
              if [ "$status" -ne 1 ]; then
                exit "$status"
              fi
            done <<< "$HUNT_BASELINES"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hunt-results
          path: merged-hunts
          if-no-files-found: error
      # Reproduction still needs namespaces, but the expensive full hunts have
      # already run independently in the matrix.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: tc -V
      # One place decides whether this run may file issues, and says so in
      # words the summary can print verbatim.
      - id: mode
        env:
          DISPATCH_CREATE: ${{ inputs.create }}
          REPOSITORY_OPT_IN: ${{ vars.NETDOC_HUNT_CREATE }}
        run: |
          opt_in=$(printf '%s' "${REPOSITORY_OPT_IN:-}" | tr '[:upper:]' '[:lower:]')
          case "$GITHUB_EVENT_NAME:${DISPATCH_CREATE:-false}:$opt_in" in
            workflow_dispatch:true:*)
              create=1
              mode='explicitly creating issues (manual dispatch, create: true)' ;;
            schedule:*:true)
              create=1
              mode='scheduled creation enabled by repository variable NETDOC_HUNT_CREATE' ;;
            *)
              create=0
              mode='observation-only: hunting and reproducing, creating no issues' ;;
          esac
          echo "create=$create" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "$mode"
      - id: triage
        env:
          CREATE: ${{ steps.mode.outputs.create }}
          CASES: ${{ inputs.cases || '60' }}
          # Has to be the bug-oracle branch of the matrix ceiling above. Triage
          # rejects a merged report whose fault ceiling is not the one it was
          # asked for, so a ceiling raised in one place and not the other fails
          # the whole nightly rather than quietly triaging the wrong hunt.
          MAX_FAULTS: "3"
          HUNT_SEED: ${{ needs.seed.outputs.value }}
          # gh reads the token from the environment; it is never an argument,
          # so it cannot reach a log line. An observation-only run gets no
          # token at all.
          GH_TOKEN: ${{ steps.mode.outputs.create == '1' && secrets.GITHUB_TOKEN || '' }}
        run: |
          args=()
          if [ "$CREATE" = "1" ]; then
            args+=(--create)
          fi
          ./netdoc-sim triage \
            --lane bug-oracle \
            --cases "$CASES" \
            --max-faults "$MAX_FAULTS" \
            --hunt-results merged-hunts/bug-oracle \
            --seed "$HUNT_SEED" \
            "${args[@]}" \
            --revision "$GITHUB_SHA" \
            --context "GitHub Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | tee triage.txt
      - if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          HUNT_SEED: ${{ needs.seed.outputs.value }}
        run: |
          {
            echo '### netdoc-sim bug-oracle Hunt triage'
            echo ''
            echo "Mode: ${MODE:-mode was never decided; the run failed before triage}"
            echo "Exploration seed: ${HUNT_SEED:-seed was not resolved}"
            echo ''
            echo '```'
            cat triage.txt 2>/dev/null || echo 'the triage step produced no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
