name: pages

# Publishes the documentation site at https://networkdoctor.dev/.
#
# The site has two sources and copies neither into this repository: docs/*.md
# lives here, and the explanatory pages live in the GitHub wiki, which is its own
# git repository. cmd/docsite reads both and writes one Jekyll source tree, so a
# page is still edited exactly where it was always edited. The `gollum` trigger is
# here so a wiki edit builds and verifies the site, and runs the em dash check on
# the wiki, before anyone publishes anything. Publishing is a manual dispatch from
# main; see the deploy job.
#
# Every step before deployment can fail the deployment. A wiki that will not
# clone, a link that resolves to nothing, a heading anchor that moved, or a link
# written against a base path the site is not served under all stop the run
# rather than publishing a site with holes in it.

on:
  # Build and verify only. A push to main does not publish; see the deploy job.
  push:
    branches: [main]
  # Build and verify on every pull request. Only a manual dispatch on
  # refs/heads/main publishes, and a pull request ref never is that, so this checks
  # the site without publishing one. Unfiltered by branch or path on purpose: the
  # site is staged from docs/, the wiki, site/, cmd/docsite, and the summaries in
  # internal/diagnostic, so there is no subset of this repository that cannot
  # break a link.
  pull_request:
  # A wiki page was created or edited. Builds and verifies the site, never publishes.
  gollum:
  # Publishes when dispatched on main. Dispatched from any other branch, it builds
  # and verifies only.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy in flight: a half-replaced site is worse than a late one.
#
# Only a manual dispatch on refs/heads/main deploys, and those share one group, so
# they serialize against each other. Every other run gets a group of its own. A
# queued run cancels the group's previously pending run, so a push, a wiki edit or
# a pull request in the deploy group could discard a pending main deploy and leave
# the published site stale with nothing red to show for it.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'pages-deploy' || format('pages-build-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wiki is a public repository of its own, so this needs no token. A
      # failure here fails the build, which is the point: the site is not
      # complete without it.
      - name: Check out the wiki
        run: git clone --depth 1 "${{ github.server_url }}/${{ github.repository }}.wiki.git" wiki
      # This repository keeps itself em dash free with
      # TestNoEmDashInTrackedTextFiles. The wiki is a git repository of its own
      # and GitHub runs no Actions in it, so the same rule is enforced from
      # here, on the `gollum` trigger that already fires on every wiki edit,
      # including the browser ones no local hook would ever see. Exit status 1
      # is grep for "no match", which is the passing case.
      - name: Check the wiki for em dashes
        run: |
          if git -C wiki grep -In --fixed-strings -e $'\u2014'; then
            echo "::error::em dash on the wiki, reword the sentence rather than swapping the character"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The generator's own tests, so a broken generator fails before it has
      # written a broken site.
      - run: go test ./cmd/docsite/...
      - name: Stage the Jekyll source from docs/ and the wiki
        run: go run ./cmd/docsite -wiki wiki -out _docsite
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: _docsite
          destination: _site
      # Checks the bytes that would be published: every internal link resolves
      # to a page the site serves at the domain root, every anchor exists,
      # nothing still points under the retired /network-doctor base path, and
      # the sitemap was written.
      - name: Verify the built site
        run: go run ./cmd/docsite -verify _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Publishes the site. Only a manual dispatch on main reaches it. A push to main,
  # a pull request, a wiki edit (gollum), or a dispatch from another branch builds
  # and verifies, then skips this job.
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
