name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  release:
    needs: [ci, verify-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # GoReleaser shells out to syft for the `sboms` block; the GoReleaser
      # action does not bring it along. Pinned action, pinned tool version.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.42.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINDOWS_PACKAGES_TOKEN: ${{ secrets.WINDOWS_PACKAGES_TOKEN }}
      # Keep attested digests from GoReleaser output; never read them from the published release.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  # The container image is how macOS and Windows run Challenge Mode, so it is
  # part of the release rather than a separate pipeline: same tag, same commit,
  # same version string in the binaries it carries.
  #
  # It builds from source instead of repackaging the release archives so that
  # `docker build .` on the same commit produces the same image, and so CI can
  # test the artifact on every pull request. needs: [release] keeps a failed
  # release from leaving a published image behind that nothing else matches.
  image:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64 is emulated for the two apk steps only: the Go builds cross-compile
      # on the native builder, so nothing slow runs under QEMU.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The immutable tag is the release; latest moves with it, the way the
      # Homebrew cask and the Scoop bucket do. Only vX.Y.Z tags reach this
      # workflow, so latest can never point at a prerelease.
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/netdoc-sim:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/netdoc-sim:latest
      # Same supply-chain contract the release archives get: something published
      # under this repository's name can be traced back to the workflow that
      # built it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/netdoc-sim
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  copr:
    # spectool pulls both tarballs off the published release, so it has to
    # exist, and attest has to have run, or the verify below has nothing to
    # check them against.
    needs: [release, attest]
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: read
      attestations: read
    steps:
      - run: dnf install -y copr-cli rpm-build rpmdevtools git-core gh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure copr-cli
        run: |
          mkdir -p ~/.config
          printf '%s' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      # The tag is the single source of version truth; the spec's own Version is
      # only what `mock` picks up when building the package by hand.
      - name: Build and submit SRPM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/network-doctor.spec
          spectool -g -R packaging/network-doctor.spec
          # Both tarballs arrive over plain HTTPS from a mutable release asset,
          # and -mod=vendor never consults go.sum, so the vendored dependency
          # source that ends up in the binary is only as trustworthy as this
          # check. Fail the build rather than sign whatever was downloaded.
          for src in "network-doctor-${VERSION}.tar.gz" "network-doctor-${VERSION}-vendor.tar.gz"; do
            gh attestation verify "$(rpm --eval '%{_sourcedir}')/${src}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          rpmbuild -bs packaging/network-doctor.spec
          # Keep the project on chroots whose Fedora repositories satisfy the
          # spec's Go requirement. Branching can add a chroot before Go lands.
          copr-cli modify heymaikol/network-doctor --follow-fedora-branching off --chroot fedora-rawhide-x86_64 --chroot fedora-rawhide-aarch64
          copr-cli build heymaikol/network-doctor ~/rpmbuild/SRPMS/*.src.rpm

  attest:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: checksums.txt
