name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  release:
    needs: [ci, verify-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # GoReleaser shells out to syft for the `sboms` block; the GoReleaser
      # action does not bring it along. Pinned action, pinned tool version.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.42.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINDOWS_PACKAGES_TOKEN: ${{ secrets.WINDOWS_PACKAGES_TOKEN }}
      # Keep attested digests from GoReleaser output; never read them from the published release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  # The container image is how macOS and Windows run Challenge Mode, so it is
  # part of the release rather than a separate pipeline: same tag, same commit,
  # same version string in the binaries it carries.
  #
  # It builds from source instead of repackaging the release archives so that
  # `docker build .` on the same commit produces the same image, and so CI can
  # test the artifact on every pull request. needs: [release] keeps a failed
  # release from leaving a published image behind that nothing else matches.
  image:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # arm64 is emulated for the two apk steps only: the Go builds cross-compile
      # on the native builder, so nothing slow runs under QEMU.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The immutable tag is the release; latest moves with it, the way the
      # Homebrew cask and the Scoop bucket do. Only vX.Y.Z tags reach this
      # workflow, so latest can never point at a prerelease.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/netdoc-sim:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/netdoc-sim:latest
      # Same supply-chain contract the release archives get: something published
      # under this repository's name can be traced back to the workflow that
      # built it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/netdoc-sim
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  attest:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: checksums.txt
