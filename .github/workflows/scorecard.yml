name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 6"

# The job declares its own token. api.scorecard.dev re-reads this file before
# accepting published results: no top-level writes, env, or defaults, and
# every step must be an allowlisted `uses:` action.
permissions: {}

jobs:
  scorecard:
    name: Supply chain analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Upload SARIF to code scanning.
      id-token: write # Sign the results published to api.scorecard.dev.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to GitHub code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
