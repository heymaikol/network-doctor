version: 2

# COPR builds in mock, which has no network, and the source tarball below is a
# git archive that can't carry untracked vendor/. Ship deps as a side tarball
# instead of committing vendor/, which would break every dependency-bump PR.
# Written to the repo root, not dist/: before-hooks run ahead of the step that
# asserts dist/ is empty, so writing there aborts the build. Untracked, so
# `git archive` keeps it out of the source tarball.
before:
  hooks:
    - go mod vendor
    - tar -czf {{ .ProjectName }}-{{ .Version }}-vendor.tar.gz vendor

builds:
  - id: netdoc
    binary: netdoc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
  # Linux only, on purpose. netdoc-sim compiles everywhere, because
  # internal/simulation has a !linux backend that returns ErrUnsupported so the
  # CLI links. But the only backend that can build a network is Linux
  # namespaces, so a macOS or Windows artifact would be a binary whose every
  # real command refuses. Same
  # tag, same version, same release as netdoc; it is a companion, not a product.
  - id: netdoc-sim
    binary: netdoc-sim
    main: ./cmd/netdoc-sim
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

# One archive per build, so the taps below can name the one they publish.
# Both keep the default binary-format name template, which starts with
# {{ .Binary }}: netdoc's release filenames are byte-for-byte what they were,
# and netdoc-sim gets its own rather than colliding with them.
archives:
  - id: netdoc
    ids: [netdoc]
    formats: [binary]
    # Scoop refuses a bare binary; Windows gets a zip instead.
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: netdoc-sim
    ids: [netdoc-sim]
    formats: [binary]

source:
  enabled: true
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"

# Syft catalogs what each artifact actually contains. Two entries because the
# classes do not overlap: `binary` covers every executable we publish (the bare
# netdoc/netdoc-sim downloads and the .exe inside the Windows zip), `package`
# covers the .deb/.rpm/.apk. Defaults otherwise: spdx-json, and name templates
# that already carry binary/os/arch or the full artifact name, so nothing
# overwrites anything.
#
# The sbom pipe runs before the checksum pipe, so these land in checksums.txt
# and the release attestation covers them like every other artifact. No second
# signing scheme needed.
sboms:
  - id: binaries
    artifacts: binary
  - id: packages
    artifacts: package

checksum:
  name_template: "checksums.txt"
  # The vendor tarball is what COPR actually compiles, so it has to be a
  # checksums.txt subject like everything else, since that is what the release
  # attestation covers, and what the copr job verifies before building.
  extra_files:
    - glob: ./network-doctor-*-vendor.tar.gz

release:
  footer: |

    If Network Doctor saves you time, you can [support its development on GitHub Sponsors](https://github.com/sponsors/heymaikol).
  extra_files:
    - glob: ./network-doctor-*-vendor.tar.gz

# Distro-agnostic packages installed straight off the release page: apt, dnf,
# apk. Repo-based installs go through COPR instead, which builds its own.
#
# No `ids` filter: every Linux build goes in, so one install puts both
# /usr/bin/netdoc and /usr/bin/netdoc-sim on the system at the same version.
# packaging/network-doctor.spec has to keep installing both to match.
# Every package manager's `homepage` is the documentation site, not the
# repository and not the releases page: it is the field a user follows to learn
# the tool, and downloads reach them through the package manager already.
nfpms:
  - package_name: network-doctor
    homepage: https://heymaikol.github.io/network-doctor/
    description: Terminal UI that diagnoses network connectivity and names the layer where the connection breaks
    maintainer: Michael Placzek <heymaikol@proton.me>
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/network-doctor/LICENSE
      # Uncompressed: nfpm does not compress, and man reads a plain .1 fine.
      # rpmbuild's brp-compress gzips it in the COPR build, hence the glob in
      # the spec's %files.
      - src: packaging/netdoc.1
        dst: /usr/share/man/man1/netdoc.1
      - src: packaging/completions/netdoc.bash
        dst: /usr/share/bash-completion/completions/netdoc
      - src: packaging/completions/netdoc.zsh
        dst: /usr/share/zsh/site-functions/_netdoc
      - src: packaging/completions/netdoc.fish
        dst: /usr/share/fish/vendor_completions.d/netdoc.fish
      # netdoc-sim ships in the same package, so its own reference material
      # ships with it: a package that installed the binary and not its man page
      # would send the user to GitHub for the command surface.
      - src: packaging/netdoc-sim.1
        dst: /usr/share/man/man1/netdoc-sim.1
      - src: packaging/completions/netdoc-sim.bash
        dst: /usr/share/bash-completion/completions/netdoc-sim
      - src: packaging/completions/netdoc-sim.zsh
        dst: /usr/share/zsh/site-functions/_netdoc-sim
      - src: packaging/completions/netdoc-sim.fish
        dst: /usr/share/fish/vendor_completions.d/netdoc-sim.fish

# netdoc only, in both. A tap or bucket accepts one archive per
# OS+arch, and the simulator is Linux-only anyway: without this filter the
# extra Linux archives make GoReleaser refuse the whole publish.
homebrew_casks:
  - ids: [netdoc]
    repository:
      owner: heymaikol
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://heymaikol.github.io/network-doctor/
    description: Terminal UI that diagnoses network connectivity and names the layer where the connection breaks
    # Unsigned binary: strip Gatekeeper quarantine on install (per GoReleaser docs).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

scoops:
  - ids: [netdoc]
    repository:
      owner: heymaikol
      name: scoop-bucket
      token: "{{ .Env.WINDOWS_PACKAGES_TOKEN }}"
    homepage: https://heymaikol.github.io/network-doctor/
    description: Terminal UI that diagnoses network connectivity and names the layer where the connection breaks
    license: Apache-2.0

changelog:
  use: github-native
