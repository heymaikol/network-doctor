[package]
name = "netdoc-gui"
version = "0.1.0"
edition = "2024"
description = "Desktop window for Network Doctor (netdoc)"
license = "Apache-2.0"
publish = false

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only the Linux device-name lookup and the stop-with-the-window guard need it.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
