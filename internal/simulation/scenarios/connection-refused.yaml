name: connection-refused
description: The target host is reachable, but nothing listens on the selected TCP port.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.1
    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            refused-target.test: 10.77.0.20
            connectivitycheck.gstatic.com: 10.77.0.1
        - {type: http, port: 80}
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.0.1}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}
    - name: target
      address: 10.77.0.20
      services:
        - {type: http, port: 80}

tests:
  - {name: selected TCP port refuses connections, node: client, target: refused-target.test:2222}
  - name: same node remains reachable
    node: client
    target: http://refused-target.test
    expect:
      verdict: ok
      checks:
        - {id: internet_tcp, status: PASS}
        - {id: dns, status: PASS}
        - {id: target_tcp, status: PASS}
        - {id: http, status: PASS}

expect:
  verdict: service
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS}
    - {id: dns, status: PASS}
    - {id: dns_public, status: PASS}
    - {id: target_tcp, status: FAIL, cause: connection_refused}
