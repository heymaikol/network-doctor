name: dns-nxdomain
description: The configured resolver answers NXDOMAIN for the target while IP connectivity remains healthy.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.1
    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            connectivitycheck.gstatic.com: 10.77.0.1
        - {type: http, port: 80}
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.0.1}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}

tests:
  - {name: office printer name does not exist, node: client, target: printer.office.test.}

expect:
  verdict: dns
  summary: printer.office.test. has no A/AAAA records according to either system or public DNS. (The general internet is reachable.)
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS}
    - {id: quic_udp_443, status: PASS}
    - {id: dns, status: FAIL, fix: "check the hostname or publish the missing DNS record"}
    - {id: dns_public, status: PASS}
    - {id: dns_encrypted, status: PASS}
    - {id: target_tcp, status: SKIP}
    - {id: tls, status: SKIP}
    - {id: http, status: SKIP}
    - {id: https, status: SKIP}
