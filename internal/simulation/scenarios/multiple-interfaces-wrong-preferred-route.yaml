name: multiple-interfaces-wrong-preferred-route
description: >-
  Both client links and both gateways are up. Linux prefers the lower-metric
  default on the isolated network, so ordinary egress fails; a specific route
  and source-selected second test prove the higher-metric working path remains
  usable.

topology:
  segments:
    - {name: working-lan, subnet: 10.77.1.0/24}
    - {name: upstream, subnet: 10.77.2.0/24}
    - {name: wrong-lan, subnet: 10.77.3.0/24}
    - {name: isolated, subnet: 10.77.4.0/24}
  nodes:
    - name: client
      role: client
      resolver: 10.77.2.20
      interfaces:
        - {segment: working-lan, address: 10.77.1.10/24}
        - {segment: wrong-lan, address: 10.77.3.10/24}
    - name: working-gateway
      role: router
      interfaces:
        - {segment: working-lan, address: 10.77.1.1/24}
        - {segment: upstream, address: 10.77.2.1/24}
    - name: wrong-gateway
      role: router
      interfaces:
        - {segment: wrong-lan, address: 10.77.3.1/24}
        - {segment: isolated, address: 10.77.4.1/24}
    - name: target
      interfaces:
        - {segment: upstream, address: 10.77.2.20/24}
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - name: routed-resolver
          type: dns
          zone:
            routed-target.test: 10.77.2.20
            connectivitycheck.gstatic.com: 10.77.2.20
        - {name: routed-http, type: http, port: 80}
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.2.20}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}
  routes:
    - {node: client, destination: default, via: 10.77.3.1, metric: 50}
    - {node: client, destination: default, via: 10.77.1.1, metric: 100}
    - {node: client, destination: 10.77.2.0/24, via: 10.77.1.1}
    - {node: working-gateway, destination: 1.1.1.1/32, via: 10.77.2.20}
    - {node: working-gateway, destination: 8.8.8.8/32, via: 10.77.2.20}
    - {node: target, destination: 10.77.1.0/24, via: 10.77.2.1}

tests:
  - name: lower metric isolated default is preferred
    node: client
  - name: working interface and specific route reach the target
    node: client
    source_segment: working-lan
    target: routed-target.test:80
    expect:
      verdict: degraded
      checks:
        - {id: iface, status: PASS}
        - {id: internet_tcp, status: WARN, cause: preferred_path_failed_alternate_reachable}
        - {id: dns, status: PASS}
        - {id: dns_encrypted, status: FAIL}
        - {id: target_tcp, status: PASS}
        - {id: http, status: PASS}

expect:
  verdict: network
  checks:
    - {id: iface, status: PASS}
    # FAIL, unlike the targeted test above. There the target's own socket left
    # by the ranked-lower default, which is a measured working alternate; here
    # there is no target and preferred_route_failed only records that a metric
    # preference existed. A WARN would report ok true and exit 0 against the
    # network verdict below.
    - {id: internet_tcp, status: FAIL, cause: preferred_route_failed}
    - {id: dns, status: PASS}
    # The encrypted resolver is reached over the preferred path, the broken one.
    - {id: dns_encrypted, status: FAIL}
