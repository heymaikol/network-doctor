name: no-default-route
description: >-
  The client has a link, an address and a resolver, but no default route.
  Nothing off-segment is reachable. Run without a target, so this asks the
  question a user asks first: is it me, or is it the internet?

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      # Off-segment on purpose: an on-link resolver would still answer without
      # a default route, and this scenario is about losing everything off-net.
      resolver: 9.9.9.9

    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8, 9.9.9.9]
      services:
        - type: dns
          zone:
            connectivitycheck.gstatic.com: 10.77.0.1
        - type: http
          port: 80
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.0.1}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}

faults:
  - type: no_default_route
    node: client

tests:
  - name: generic checks with no way out
    node: client

expect:
  verdict: network
  summary: "Offline: neither the system resolver nor direct TCP to the egress check's reference endpoints is working."
  checks:
    # The link is genuinely up, so reporting it as down would be the wrong story.
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: FAIL, cause: no_default_route, fix: "no default route: nothing in the routing table leads off this network, check DHCP, the VPN, or a static route"}
    - {id: dns, status: FAIL}
    # No route out means no resolver of any kind is reachable, encrypted or not.
    - {id: dns_encrypted, status: FAIL}
