name: packet-loss
description: Moderate seeded packet loss degrades one otherwise healthy local network.

# The seed fixes which positions on the client's queue are dropped, not which
# packets fill them: concurrent probes enqueue in a slightly different order on
# every run. So which row the loss reaches is not part of the scenario. A lost
# SYN costs a TCP row a one second retransmission, which it reports as high
# latency; a QUIC handshake can run out its budget; and when the loss takes both
# of the A queries the dns row sends in its budget, a DNS timeout is the correct
# report for that run. The only row every run owes is the interface, so that is
# all this file expects.
#
# TestPacketLossScenario holds each run to the report its own evidence calls
# for. Netem shapes only the client's egress, so an answer a resolver logged
# sending is one the client received. Only the dns row asks loss-resolver for
# the target, and only the public DNS row asks the internet node for it, so
# those two rows are held to those logs. QUIC shares its endpoint's name with
# the egress row's portal check, which asks once, so QUIC is held only to
# answers beyond that one. The other rows have no such log, so there the test
# asks only that the loss slowed or silenced them, that a failure says it timed
# out, and that nothing happened a loss cannot do.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.53
    - name: resolver
      address: 10.77.0.53
      services:
        - name: loss-resolver
          type: dns
          zone:
            lossy-target.test: 10.77.0.1
            connectivitycheck.gstatic.com: 10.77.0.1
    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            lossy-target.test: 10.77.0.1
            connectivitycheck.gstatic.com: 10.77.0.1
        - {type: http, port: 80}
        - {name: lossy-target, type: tcp, port: 9999}
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.0.1}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}

faults:
  - type: netem
    node: client
    delay: 20ms
    loss: 10%
    seed: 219540062

tests:
  - {name: connectivity under loss, node: client, target: "lossy-target.test:9999"}

expect:
  checks:
    - {id: iface, status: PASS}
