name: same-family-failover
description: The first IPv4 target is silently filtered, so the second ordered A record carries the connection.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.1

    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          records:
            - {name: failover-target.test, address: 10.77.0.20}
            - {name: failover-target.test, address: 10.77.0.21}
            - {name: connectivitycheck.gstatic.com, address: 10.77.0.1}
        - {type: http, port: 80}
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.0.1}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}

    - name: black-holed-target
      address: 10.77.0.20

    - name: healthy-target
      address: 10.77.0.21
      services:
        - {name: failover-http, type: http, port: 80}

faults:
  - {type: drop, node: black-holed-target, direction: inbound, to: 10.77.0.20, protocol: tcp, port: 80}

tests:
  - {name: second A record survives the black hole, node: client, target: failover-target.test:80}

expect:
  verdict: degraded
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS}
    - {id: dns, status: PASS}
    - {id: dns_public, status: PASS}
    - {id: target_tcp, status: WARN}
    - {id: path_mtu, status: PASS}
    - {id: http, status: PASS}
