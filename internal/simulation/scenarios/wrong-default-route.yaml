name: wrong-default-route
description: >-
  The selected default gateway exists and answers on the client LAN, but it is
  attached to an isolated upstream. A separate specific route proves that the
  correct router and destination path exist while default traffic takes the
  wrong next hop.

topology:
  segments:
    - {name: client-lan, subnet: 10.77.1.0/24}
    - {name: upstream, subnet: 10.77.2.0/24}
    - {name: isolated, subnet: 10.77.4.0/24}
  nodes:
    - name: client
      role: client
      resolver: 10.77.2.20
      interfaces:
        - {segment: client-lan, address: 10.77.1.10/24}
    - name: correct-gateway
      role: router
      interfaces:
        - {segment: client-lan, address: 10.77.1.1/24}
        - {segment: upstream, address: 10.77.2.1/24}
    - name: wrong-gateway
      role: router
      interfaces:
        - {segment: client-lan, address: 10.77.1.254/24}
        - {segment: isolated, address: 10.77.4.1/24}
    - name: target
      interfaces:
        - {segment: upstream, address: 10.77.2.20/24}
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - name: routed-resolver
          type: dns
          zone:
            routed-target.test: 10.77.2.20
            connectivitycheck.gstatic.com: 10.77.2.20
        - {name: routed-http, type: http, port: 80}
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.2.20}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}
  routes:
    - {node: client, destination: default, via: 10.77.1.1}
    - {node: client, destination: 10.77.2.0/24, via: 10.77.1.1}
    - {node: correct-gateway, destination: 1.1.1.1/32, via: 10.77.2.20}
    - {node: correct-gateway, destination: 8.8.8.8/32, via: 10.77.2.20}
    - {node: target, destination: 10.77.1.0/24, via: 10.77.2.1}

faults:
  - {type: replace_default_route, node: client, via: 10.77.1.254}

tests:
  - name: default traffic selects the reachable wrong gateway
    node: client
  - name: specific correct path still reaches the routed target
    node: client
    target: routed-target.test:80
    expect:
      verdict: degraded
      checks:
        - {id: iface, status: PASS}
        # FAIL rather than WARN. The specific route reaches 10.77.2.20, which
        # is one subnet over through the correct router, so the run never
        # reaches a destination off this network at all; selected_path_failed
        # is routing metadata read after the failure and establishes no working
        # alternate either. Nothing here has earned the relaxed row that would
        # take the failure out of ok and the exit status.
        - {id: internet_tcp, status: FAIL, cause: selected_path_failed}
        - {id: dns, status: PASS}
        - {id: dns_encrypted, status: FAIL}
        - {id: target_tcp, status: PASS}
        - {id: http, status: PASS}

expect:
  verdict: network
  checks:
    - {id: iface, status: PASS}
    # The verdict below is network, so the row may not be a WARN: a relaxed
    # egress row reports ok true and exits 0, which would contradict it. The
    # resolver answering is not a path off this network.
    - {id: internet_tcp, status: FAIL, cause: selected_path_failed}
    - {id: dns, status: PASS}
    # The encrypted resolver is reached over the failed default path, so this
    # is that routing failure showing up again, not a block on DoH/DoT.
    - {id: dns_encrypted, status: FAIL}
