hostname r2
line vty
 no login
router bgp 65002
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 10.0.1.1 remote-as 65001
 neighbor 10.0.1.1 timers connect 5
 address-family ipv4 unicast
  network 10.10.1.0/24
  network 10.10.2.0/24
  network 10.10.9.0/24
  network 203.0.113.0/24
  neighbor 10.0.1.1 route-map RECURSE out
  neighbor 10.0.1.1 activate
 exit-address-family

ip prefix-list RECURSE seq 5 permit 203.0.113.0/24
route-map RECURSE permit 10
 match ip address prefix-list RECURSE
 set ip next-hop 10.10.9.2
route-map RECURSE permit 20
