hostname r3
line vty
 no login
router bgp 65002
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 neighbor 10.0.3.1 remote-as 65001
 neighbor 10.0.3.1 timers connect 5
 address-family ipv4 unicast
  network 10.10.2.0/24
  neighbor 10.0.3.1 route-map SHARED out
  network 10.10.3.0/24
  neighbor 10.0.3.1 activate
 exit-address-family

ip prefix-list SHARED seq 5 permit 10.10.2.0/24
route-map SHARED permit 10
 match ip address prefix-list SHARED
 set ip next-hop 10.0.1.2
route-map SHARED permit 20
